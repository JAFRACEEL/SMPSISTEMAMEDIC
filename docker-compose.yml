# SISTEMAMEDIC - entorno DEV local. Solo datos sintéticos. NO usar en staging ni PROD.
# Secretos: solo por .env (copiar infra/env/dev.env.example a .env). Puertos no privilegiados, enlazados a 127.0.0.1.
name: sistemamedic-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistemamedic_dev}
      POSTGRES_USER: ${POSTGRES_USER:-sm_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env (plantilla en infra/env/dev.env.example)}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      SMD_ENVIRONMENT: ${SMD_ENVIRONMENT:-dev}
      SMD_LOG_LEVEL: ${SMD_LOG_LEVEL:-INFO}
      # Lista JSON, sin comodín. Compose no pasa al contenedor las variables de .env que no se listan aquí.
      SMD_CORS_ORIGINS: ${SMD_CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
      SMD_SECRET_KEY: ${SMD_SECRET_KEY:?Defina SMD_SECRET_KEY en .env (plantilla en infra/env/dev.env.example)}
      SMD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sm_dev}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sistemamedic_dev}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      # Contrato único: GET /api/health.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    environment:
      # El navegador llama a /api en el mismo origen; Vite lo reenvía al servicio backend.
      SMD_DEV_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
